name: Daily sync MŚ 2026

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj sync endpoint
        run: |
          curl -X GET "${{ secrets.VERCEL_APP_URL }}/api/sync-cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f --silent --show-error
