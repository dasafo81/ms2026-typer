name: Daily sync MŚ 2026

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj sync endpoint
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X GET "${VERCEL_APP_URL}/api/sync-cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -f --silent --show-error
